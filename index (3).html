<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balancing Chemical Reactions</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mint: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(180deg, #e8f7ee 0%, #d4f0e0 50%, #c1ebd3 100%);
            min-height: 100vh;
        }
        .app-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(134, 239, 172, 0.5);
            box-shadow: 0 10px 25px -5px rgba(22, 163, 74, 0.08);
        }
        /* Hide spin buttons for numeric inputs */
        input[type='number']::-webkit-inner-spin-button,
        input[type='number']::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type='number'] {
            -moz-appearance: textfield;
        }
        /* Mobile phone mockup viewport frame simulation styling when viewed on desktop */
        .phone-frame {
            max-width: 440px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="font-sans text-slate-800 p-3 sm:p-4 min-h-screen flex flex-col justify-between">

    <!-- MAIN VERTICAL CONTAINER (MIT App Inventor Screen Mockup Layout) -->
    <main class="phone-frame w-full flex-grow flex flex-col space-y-4">

        <!-- ================= TOP ROW: HEADER & PRESET SELECTOR ================= -->
        <header class="app-card rounded-2xl p-4 text-center border-t-4 border-t-mint-500 shadow-md">
            <div class="flex items-center justify-center space-x-2 mb-1">
                <div class="w-8 h-8 rounded-full bg-mint-100 flex items-center justify-center text-mint-600">
                    <i class="fa-solid fa-flask text-lg"></i>
                </div>
                <h1 class="text-xl font-extrabold text-mint-900 tracking-tight">Balancing Chemical Reactions</h1>
            </div>
            <p class="text-xs text-slate-500 font-medium mb-3">Balance atoms on both sides of the reaction</p>
            
            <!-- Reaction Dropdown Selector -->
            <div class="relative w-full">
                <select id="reaction-select" onchange="loadSelectedReaction()" class="w-full text-xs sm:text-sm bg-mint-50 border-2 border-mint-200 text-mint-900 font-bold rounded-xl px-3 py-2 focus:ring-2 focus:ring-mint-500 focus:border-mint-500 outline-none appearance-none pr-8">
                    <!-- Populated dynamically -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-mint-700">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </div>
            </div>
        </header>


        <!-- ================= MIDDLE ROW 1: MAIN EQUATION BANNER ================= -->
        <section class="app-card rounded-2xl p-4 text-center">
            <span class="text-[10px] font-bold uppercase tracking-wider text-mint-700 bg-mint-100 px-2.5 py-1 rounded-full inline-block mb-2">
                <i class="fa-solid fa-atom mr-1"></i> Active Equation
            </span>
            <div id="equation-banner" class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 text-lg sm:text-xl font-black text-slate-800 py-2 bg-slate-50/80 rounded-xl border border-slate-100">
                <!-- Dynamically rendered active equation text (e.g. 2 H₂ + O₂ ➔ 2 H₂O) -->
            </div>
        </section>


        <!-- ================= MIDDLE ROW 2: FORMULA CARDS & ANSWER INPUT BOXES ================= -->
        <section class="app-card rounded-2xl p-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600 flex items-center gap-1.5">
                    <i class="fa-solid fa-pen-to-square text-mint-600"></i> Set Coefficients
                </h2>
                <span class="text-[10px] font-medium text-slate-400">Match left & right side</span>
            </div>

            <!-- Vertical list of Compound Cards paired with Answer Boxes -->
            <div id="compounds-container" class="space-y-3">
                <!-- Dynamically generated stacked cards -->
            </div>
        </section>


        <!-- ================= MIDDLE ROW 3: ATOM BALANCE MONITOR ================= -->
        <section class="app-card rounded-2xl p-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-600 mb-3 flex items-center justify-between">
                <span><i class="fa-solid fa-scale-balanced text-mint-600 mr-1.5"></i> Live Atom Balance</span>
                <span id="balance-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">Unbalanced</span>
            </h3>
            
            <div id="atom-tally-container" class="space-y-2">
                <!-- Reactants vs Products live tally with visual comparison -->
            </div>
        </section>


        <!-- ================= BOTTOM ROW: ACTIONS & PROGRESS ================= -->
        <section class="space-y-3 pb-2">
            
            <!-- Dynamic Alert Message Box -->
            <div id="feedback-msg" class="hidden p-3 rounded-xl font-bold text-xs text-center border transition-all duration-300"></div>

            <!-- Primary Buttons Vertical / Row Stack -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="resetInputs()" class="w-full py-3 bg-white hover:bg-slate-100 text-slate-700 font-bold text-xs rounded-xl shadow-sm border border-slate-200 transition active:scale-95 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
                <button id="next-btn" onclick="nextReaction()" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl shadow-sm transition active:scale-95 flex items-center justify-center gap-1.5">
                    Next <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <button onclick="checkAnswer()" class="w-full py-3.5 bg-gradient-to-r from-mint-500 to-emerald-600 hover:from-mint-600 hover:to-emerald-700 text-white font-extrabold text-sm rounded-xl shadow-md hover:shadow-mint-200 transition transform active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-check text-base"></i> Check Answer
            </button>

            <!-- Bottom Progress & Score Footer Bar -->
            <div class="app-card rounded-xl px-4 py-2 flex items-center justify-between text-xs font-medium text-slate-600">
                <div class="flex items-center space-x-2">
                    <span>Level:</span>
                    <span id="level-indicator" class="font-extrabold text-mint-700">1 / 6</span>
                </div>
                <div class="w-1/3 bg-slate-200 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-mint-500 h-full w-1/6 transition-all duration-300"></div>
                </div>
                <div class="flex items-center space-x-1">
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <span id="score-display" class="font-extrabold text-slate-800">Score: 0</span>
                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="text-center py-2 text-[10px] text-slate-500">
        MIT App Inventor Interactive Reference &bull; Mobile Layout View
    </footer>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        // Chemical Reaction Data Set
        const reactions = [
            {
                id: 1,
                name: "Synthesis of Water (H₂ + O₂)",
                reactants: [
                    { formula: "H₂", elements: { H: 2 }, initialCoef: 1, side: "Reactant" },
                    { formula: "O₂", elements: { O: 2 }, initialCoef: 1, side: "Reactant" }
                ],
                products: [
                    { formula: "H₂O", elements: { H: 2, O: 1 }, initialCoef: 1, side: "Product" }
                ],
                solution: [2, 1, 2]
            },
            {
                id: 2,
                name: "Rusting of Iron (Fe + O₂)",
                reactants: [
                    { formula: "Fe", elements: { Fe: 1 }, initialCoef: 1, side: "Reactant" },
                    { formula: "O₂", elements: { O: 2 }, initialCoef: 1, side: "Reactant" }
                ],
                products: [
                    { formula: "Fe₂O₃", elements: { Fe: 2, O: 3 }, initialCoef: 1, side: "Product" }
                ],
                solution: [4, 3, 2]
            },
            {
                id: 3,
                name: "Methane Combustion (CH₄ + O₂)",
                reactants: [
                    { formula: "CH₄", elements: { C: 1, H: 4 }, initialCoef: 1, side: "Reactant" },
                    { formula: "O₂", elements: { O: 2 }, initialCoef: 1, side: "Reactant" }
                ],
                products: [
                    { formula: "CO₂", elements: { C: 1, O: 2 }, initialCoef: 1, side: "Product" },
                    { formula: "H₂O", elements: { H: 2, O: 1 }, initialCoef: 1, side: "Product" }
                ],
                solution: [1, 2, 1, 2]
            },
            {
                id: 4,
                name: "Ammonia Synthesis (N₂ + H₂)",
                reactants: [
                    { formula: "N₂", elements: { N: 2 }, initialCoef: 1, side: "Reactant" },
                    { formula: "H₂", elements: { H: 2 }, initialCoef: 1, side: "Reactant" }
                ],
                products: [
                    { formula: "NH₃", elements: { N: 1, H: 3 }, initialCoef: 1, side: "Product" }
                ],
                solution: [1, 3, 2]
            },
            {
                id: 5,
                name: "Aluminum Oxide (Al + O₂)",
                reactants: [
                    { formula: "Al", elements: { Al: 1 }, initialCoef: 1, side: "Reactant" },
                    { formula: "O₂", elements: { O: 2 }, initialCoef: 1, side: "Reactant" }
                ],
                products: [
                    { formula: "Al₂O₃", elements: { Al: 2, O: 3 }, initialCoef: 1, side: "Product" }
                ],
                solution: [4, 3, 2]
            },
            {
                id: 6,
                name: "Sodium Chloride (Na + Cl₂)",
                reactants: [
                    { formula: "Na", elements: { Na: 1 }, initialCoef: 1, side: "Reactant" },
                    { formula: "Cl₂", elements: { Cl: 2 }, initialCoef: 1, side: "Reactant" }
                ],
                products: [
                    { formula: "NaCl", elements: { Na: 1, Cl: 1 }, initialCoef: 1, side: "Product" }
                ],
                solution: [2, 1, 2]
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let userCoefficients = [];

        // Color badge dictionary for chemical elements
        const elementColors = {
            H: "bg-blue-100 text-blue-800 border-blue-200",
            O: "bg-red-100 text-red-800 border-red-200",
            C: "bg-slate-200 text-slate-800 border-slate-300",
            N: "bg-indigo-100 text-indigo-800 border-indigo-200",
            Fe: "bg-amber-100 text-amber-900 border-amber-300",
            Na: "bg-purple-100 text-purple-800 border-purple-200",
            Cl: "bg-emerald-100 text-emerald-800 border-emerald-200",
            Al: "bg-teal-100 text-teal-800 border-teal-200"
        };

        window.onload = function() {
            populateSelectOptions();
            loadReaction(0);
        };

        function populateSelectOptions() {
            const select = document.getElementById("reaction-select");
            select.innerHTML = "";
            reactions.forEach((r, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = `${idx + 1}. ${r.name}`;
                select.appendChild(opt);
            });
        }

        function loadSelectedReaction() {
            const select = document.getElementById("reaction-select");
            loadReaction(parseInt(select.value));
        }

        function formatSubscripts(formula) {
            return formula.replace(/(\d+)/g, '<sub>$1</sub>');
        }

        function loadReaction(index) {
            currentIndex = index;
            document.getElementById("reaction-select").value = index;
            const rxn = reactions[currentIndex];
            
            const totalCompounds = rxn.reactants.length + rxn.products.length;
            // Pre-fill user inputs with initial coefficient values (1)
            userCoefficients = rxn.reactants.concat(rxn.products).map(c => c.initialCoef || 1);

            // Update Level & Progress Bar
            document.getElementById("level-indicator").textContent = `${currentIndex + 1} / ${reactions.length}`;
            document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / reactions.length) * 100}%`;

            hideFeedback();
            renderBannerEquation();
            renderCompoundInputCards();
            updateTally();
        }

        // Render TOP EQUATION BANNER
        function renderBannerEquation() {
            const rxn = reactions[currentIndex];
            const banner = document.getElementById("equation-banner");
            banner.innerHTML = "";

            let globalIdx = 0;

            rxn.reactants.forEach((mol, idx) => {
                if (idx > 0) {
                    banner.innerHTML += `<span class="text-slate-400 font-bold">+</span>`;
                }
                const coefStr = userCoefficients[globalIdx] > 1 ? `<span class="text-mint-600 font-black mr-0.5">${userCoefficients[globalIdx]}</span>` : '';
                banner.innerHTML += `<span>${coefStr}${formatSubscripts(mol.formula)}</span>`;
                globalIdx++;
            });

            banner.innerHTML += `<span class="text-mint-600 font-black px-1">➔</span>`;

            rxn.products.forEach((mol, idx) => {
                if (idx > 0) {
                    banner.innerHTML += `<span class="text-slate-400 font-bold">+</span>`;
                }
                const coefStr = userCoefficients[globalIdx] > 1 ? `<span class="text-mint-600 font-black mr-0.5">${userCoefficients[globalIdx]}</span>` : '';
                banner.innerHTML += `<span>${coefStr}${formatSubscripts(mol.formula)}</span>`;
                globalIdx++;
            });
        }

        // Render VERTICAL SEPARATED COMPOUND SQUARE & ANSWER INPUT BOXES
        function renderCompoundInputCards() {
            const rxn = reactions[currentIndex];
            const container = document.getElementById("compounds-container");
            container.innerHTML = "";

            const allMolecules = [...rxn.reactants, ...rxn.products];

            let globalIdx = 0;
            rxn.reactants.forEach(mol => {
                container.appendChild(createCompoundRow(globalIdx, mol, "REACTANT"));
                globalIdx++;
            });

            // Arrow separator indicator between reactants and products
            const separator = document.createElement("div");
            separator.className = "flex items-center justify-center my-2 space-x-2 text-mint-700 font-extrabold text-xs uppercase tracking-wider";
            separator.innerHTML = `<div class="h-px bg-mint-200 flex-grow"></div><span><i class="fa-solid fa-arrow-down mr-1"></i> Yields (Products)</span><div class="h-px bg-mint-200 flex-grow"></div>`;
            container.appendChild(separator);

            rxn.products.forEach(mol => {
                container.appendChild(createCompoundRow(globalIdx, mol, "PRODUCT"));
                globalIdx++;
            });
        }

        function createCompoundRow(index, molecule, side) {
            const card = document.createElement("div");
            card.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col space-y-2";

            // Top Row: Square Substance Box + Answer Input Rectangular Box
            const topRow = document.createElement("div");
            topRow.className = "flex items-center justify-between gap-2";

            // Square Compound Badge Card [ H2 ]
            const squareBox = document.createElement("div");
            squareBox.className = "w-20 h-14 bg-mint-100/80 border-2 border-mint-300 rounded-xl flex flex-col items-center justify-center shadow-inner flex-shrink-0";
            squareBox.innerHTML = `
                <span class="text-xs text-mint-800 font-bold tracking-tight uppercase text-[9px]">${side}</span>
                <span class="text-lg font-black text-slate-800 leading-none">${formatSubscripts(molecule.formula)}</span>
            `;

            // Answer Input Controls Box [ - ] [ Input Answer ] [ + ]
            const answerBox = document.createElement("div");
            answerBox.className = "flex-grow bg-slate-50 border border-slate-200 p-1.5 rounded-xl flex items-center justify-between";

            const label = document.createElement("span");
            label.className = "text-xs font-bold text-slate-500 pl-1";
            label.textContent = "Coef:";

            const inputGroup = document.createElement("div");
            inputGroup.className = "flex items-center space-x-1";

            const btnMinus = document.createElement("button");
            btnMinus.className = "w-8 h-8 rounded-lg bg-white border border-slate-300 text-slate-700 font-bold hover:bg-slate-100 active:scale-95 transition flex items-center justify-center shadow-sm";
            btnMinus.textContent = "-";
            btnMinus.onclick = () => updateCoef(index, -1);

            const input = document.createElement("input");
            input.type = "number";
            input.min = "1";
            input.max = "99";
            input.value = userCoefficients[index];
            input.className = "w-12 h-8 text-center font-black text-base text-mint-900 bg-white border-2 border-mint-300 rounded-lg focus:ring-2 focus:ring-mint-500 outline-none";
            input.onchange = (e) => setCoef(index, parseInt(e.target.value) || 1);

            const btnPlus = document.createElement("button");
            btnPlus.className = "w-8 h-8 rounded-lg bg-white border border-slate-300 text-slate-700 font-bold hover:bg-slate-100 active:scale-95 transition flex items-center justify-center shadow-sm";
            btnPlus.textContent = "+";
            btnPlus.onclick = () => updateCoef(index, 1);

            inputGroup.appendChild(btnMinus);
            inputGroup.appendChild(input);
            inputGroup.appendChild(btnPlus);

            answerBox.appendChild(label);
            answerBox.appendChild(inputGroup);

            topRow.appendChild(squareBox);
            topRow.appendChild(answerBox);

            // Bottom Detailed Atom Breakdown inside compound card
            const breakdownRow = document.createElement("div");
            breakdownRow.className = "text-[11px] bg-slate-50 p-2 rounded-lg border border-slate-100 flex flex-wrap gap-2 items-center justify-start";
            
            const currentCoef = userCoefficients[index];
            let breakdownHtml = `<span class="text-slate-400 font-semibold mr-1">Atoms:</span>`;
            
            Object.entries(molecule.elements).forEach(([elem, count]) => {
                const badgeStyle = elementColors[elem] || "bg-slate-100 text-slate-800";
                const totalAtoms = count * currentCoef;
                breakdownHtml += `
                    <span class="inline-flex items-center gap-1 bg-white px-2 py-0.5 rounded border text-slate-700 font-medium">
                        <strong class="px-1 rounded text-[10px] ${badgeStyle}">${elem}</strong> 
                        ${count} × ${currentCoef} = <strong class="text-mint-800 font-bold">${totalAtoms}</strong>
                    </span>
                `;
            });

            breakdownRow.innerHTML = breakdownHtml;

            card.appendChild(topRow);
            card.appendChild(breakdownRow);

            return card;
        }

        function updateCoef(index, change) {
            let val = (userCoefficients[index] || 1) + change;
            if (val < 1) val = 1;
            if (val > 99) val = 99;
            setCoef(index, val);
        }

        function setCoef(index, value) {
            userCoefficients[index] = Math.max(1, value);
            renderBannerEquation();
            renderCompoundInputCards();
            updateTally();
            hideFeedback();
        }

        function calculateTotals() {
            const rxn = reactions[currentIndex];
            const reactantTotals = {};
            const productTotals = {};

            let idx = 0;
            rxn.reactants.forEach(mol => {
                const coef = userCoefficients[idx];
                Object.entries(mol.elements).forEach(([elem, count]) => {
                    reactantTotals[elem] = (reactantTotals[elem] || 0) + (count * coef);
                });
                idx++;
            });

            rxn.products.forEach(mol => {
                const coef = userCoefficients[idx];
                Object.entries(mol.elements).forEach(([elem, count]) => {
                    productTotals[elem] = (productTotals[elem] || 0) + (count * coef);
                });
                idx++;
            });

            return { reactantTotals, productTotals };
        }

        function updateTally() {
            const { reactantTotals, productTotals } = calculateTotals();
            const container = document.getElementById("atom-tally-container");
            container.innerHTML = "";

            const allElements = Array.from(new Set([...Object.keys(reactantTotals), ...Object.keys(productTotals)]));
            let overallBalanced = true;

            allElements.forEach(elem => {
                const reqCount = reactantTotals[elem] || 0;
                const prodCount = productTotals[elem] || 0;
                const isBalanced = reqCount === prodCount;
                if (!isBalanced) overallBalanced = false;

                const card = document.createElement("div");
                card.className = `p-2.5 rounded-xl border flex items-center justify-between text-xs transition-all ${
                    isBalanced ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'
                }`;

                const badgeStyle = elementColors[elem] || "bg-slate-100 text-slate-800";

                card.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="px-2 py-0.5 rounded font-bold border text-[10px] ${badgeStyle}">${elem}</span>
                        <span class="font-bold text-slate-700">Atom Balance</span>
                    </div>
                    <div class="flex items-center space-x-2 font-extrabold">
                        <span class="${isBalanced ? 'text-emerald-800' : 'text-slate-600'}">Left: ${reqCount}</span>
                        <span class="text-slate-300">|</span>
                        <span class="${isBalanced ? 'text-emerald-800' : 'text-slate-600'}">Right: ${prodCount}</span>
                        <i class="fa-solid ${isBalanced ? 'fa-circle-check text-emerald-500' : 'fa-circle-xmark text-rose-400'} text-sm ml-1"></i>
                    </div>
                `;
                container.appendChild(card);
            });

            // Update top balance badge
            const balanceBadge = document.getElementById("balance-badge");
            if (overallBalanced) {
                balanceBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800";
                balanceBadge.textContent = "Balanced!";
            } else {
                balanceBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800";
                balanceBadge.textContent = "Unbalanced";
            }
        }

        function checkAnswer() {
            const rxn = reactions[currentIndex];
            const isCorrect = userCoefficients.every((val, i) => val === rxn.solution[i]);

            const msgBox = document.getElementById("feedback-msg");
            msgBox.classList.remove("hidden", "bg-emerald-100", "text-emerald-800", "border-emerald-300", "bg-rose-100", "text-rose-800", "border-rose-300");

            if (isCorrect) {
                msgBox.classList.add("bg-emerald-100", "text-emerald-800", "border-emerald-300");
                msgBox.innerHTML = `<i class="fa-solid fa-trophy mr-1 text-amber-500"></i> Correct! Equation is perfectly balanced!`;
                
                score += 10;
                document.getElementById("score-display").textContent = `Score: ${score}`;

                // Trigger confetti celebration
                try {
                    confetti({
                        particleCount: 70,
                        spread: 60,
                        origin: { y: 0.7 }
                    });
                } catch(e) {}
            } else {
                msgBox.classList.add("bg-rose-100", "text-rose-800", "border-rose-300");
                msgBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> Not balanced yet! Adjust the input boxes and check atom counts.`;
            }
        }

        function resetInputs() {
            const rxn = reactions[currentIndex];
            const total = rxn.reactants.length + rxn.products.length;
            userCoefficients = new Array(total).fill(1);
            renderBannerEquation();
            renderCompoundInputCards();
            updateTally();
            hideFeedback();
        }

        function nextReaction() {
            const nextIdx = (currentIndex + 1) % reactions.length;
loadReaction(nextIdx);
        }

        function hideFeedback() {
            const msgBox = document.getElementById("feedback-msg");
            msgBox.classList.add("hidden");
        }
